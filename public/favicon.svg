<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.6"/>
  
  <!-- Glowing subtle backdrop behind bolt -->
  <path d="M72 12 L30 68 L60 68 L48 116 L102 54 L68 54 Z" fill="#06b6d4" opacity="0.3" filter="url(#glow)"/>
  
  <!-- High Voltage Lightning Bolt Shape -->
  <path d="M74 14 L32 70 L62 70 L50 114 L98 56 L66 56 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
